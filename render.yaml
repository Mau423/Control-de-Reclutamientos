services:
  - type: web
    name: controlvacantes
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: IA_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
